<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Найди элемент — Химия 8 класс</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    color: #fff;
  }
  .game {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 25px;
    max-width: 750px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  h1 {
    text-align: center;
    font-size: 1.7em;
    margin-bottom: 5px;
    background: linear-gradient(90deg, #00e0ff, #7bff00);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { text-align: center; color: #9fb8c8; font-size: 0.9em; margin-bottom: 18px; }

  .hud {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  .hud-item {
    flex: 1;
    min-width: 100px;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 8px 12px;
    text-align: center;
  }
  .hud-item .label { font-size: 0.75em; color: #8fa9b8; text-transform: uppercase; letter-spacing: 1px; }
  .hud-item .value { font-size: 1.3em; font-weight: bold; color: #00e0ff; }

  .task {
    background: rgba(0,224,255,0.1);
    border: 1px solid rgba(0,224,255,0.4);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    margin-bottom: 18px;
    font-size: 1.05em;
    line-height: 1.5;
  }
  .task b { color: #7bff00; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  .card {
    aspect-ratio: 1 / 1;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .card:hover:not(.done) {
    transform: translateY(-4px) scale(1.03);
    border-color: #00e0ff;
    box-shadow: 0 8px 20px rgba(0,224,255,0.3);
  }
  .card .symbol { font-size: 1.6em; font-weight: bold; color: #fff; text-align: center; padding: 0 4px; }
  .card.correct { background: rgba(123,255,0,0.25); border-color: #7bff00; animation: pop 0.4s; }
  .card.wrong { background: rgba(255,60,60,0.25); border-color: #ff3c3c; animation: shake 0.4s; }
  .card.done { cursor: default; opacity: 0.85; }
  .card.done.correct .symbol::after { content: " ✓"; color: #7bff00; }
  @keyframes pop { 0%{transform:scale(1);} 50%{transform:scale(1.15);} 100%{transform:scale(1);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 1.1em;
    font-weight: bold;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #00e0ff, #7bff00);
    color: #06222c;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(0,224,255,0.4); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .msg {
    text-align: center;
    min-height: 26px;
    margin-bottom: 12px;
    font-size: 1em;
    font-weight: bold;
  }
  .msg.good { color: #7bff00; }
  .msg.bad { color: #ff6b6b; }

  .final {
    text-align: center;
    padding: 20px 0;
  }
  .final h2 { font-size: 1.6em; margin-bottom: 10px; color: #7bff00; }
  .final p { color: #cde; margin-bottom: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="game">
  <h1>⚛️ Найди атом</h1>
  <div class="subtitle">Химия · 8 класс · строение атома</div>

  <div id="playArea">
    <div class="hud">
      <div class="hud-item"><div class="label">Раунд</div><div class="value" id="roundVal">1 / 8</div></div>
      <div class="hud-item"><div class="label">Счёт</div><div class="value" id="scoreVal">0</div></div>
      <div class="hud-item"><div class="label">Ошибки</div><div class="value" id="errVal">0</div></div>
    </div>

    <div class="task" id="task"></div>
    <div class="msg" id="msg"></div>

    <div class="grid" id="grid"></div>

    <button class="btn" id="nextBtn" disabled>Следующий раунд →</button>
  </div>

  <div class="final hidden" id="finalArea">
    <h2>🎉 Игра завершена!</h2>
    <p id="finalScore"></p>
    <p id="finalRank"></p>
    <button class="btn" onclick="restart()">Играть снова</button>
  </div>
</div>

<script>
/* ===== БАЗА ЭЛЕМЕНТОВ (символ, название, заряд ядра) ===== */
const ELEMENTS = [
  { sym: "H",  name: "Водород",  z: 1  },
  { sym: "He", name: "Гелий",    z: 2  },
  { sym: "Li", name: "Литий",    z: 3  },
  { sym: "C",  name: "Углерод",  z: 6  },
  { sym: "N",  name: "Азот",     z: 7  },
  { sym: "O",  name: "Кислород", z: 8  },
  { sym: "F",  name: "Фтор",     z: 9  },
  { sym: "Na", name: "Натрий",   z: 11 },
  { sym: "Mg", name: "Магний",   z: 12 },
  { sym: "Al", name: "Алюминий", z: 13 },
  { sym: "Si", name: "Кремний",  z: 14 },
  { sym: "P",  name: "Фосфор",   z: 15 },
  { sym: "S",  name: "Сера",     z: 16 },
  { sym: "Cl", name: "Хлор",     z: 17 },
  { sym: "K",  name: "Калий",    z: 19 },
  { sym: "Ca", name: "Кальций",  z: 20 },
  { sym: "Fe", name: "Железо",   z: 26 },
  { sym: "Cu", name: "Медь",     z: 29 },
  { sym: "Zn", name: "Цинк",     z: 30 },
  { sym: "Br", name: "Бром",     z: 35 },
  { sym: "Ag", name: "Серебро",  z: 47 },
  { sym: "I",  name: "Иод",      z: 53 },
  { sym: "Ba", name: "Барий",    z: 56 },
  { sym: "Au", name: "Золото",   z: 79 }
];

const TOTAL_ROUNDS = 8;
let round, score, errors, currentTask, locked;

/* ===== ГЕНЕРАТОР ЗАДАНИЙ ===== */
function makeTask() {
  const correct = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
  const type = Math.floor(Math.random() * 3); // 0,1,2

  // варианты-обманки
  const pool = ELEMENTS.filter(e => e.sym !== correct.sym);
  shuffle(pool);
  const options = [correct, ...pool.slice(0, 3)];
  shuffle(options);

  let question;
  let buttonMode; // "sym" — на кнопках символы, "name" — на кнопках названия

  if (type === 0) {
    // по заряду ядра -> на кнопках символы
    question = `Найди атом элемента с зарядом ядра <b>Z = ${correct.z}</b>`;
    buttonMode = "sym";
  } else if (type === 1) {
    // по названию -> на кнопках символы
    question = `Найди атом химического элемента <b>${correct.name}</b>`;
    buttonMode = "sym";
  } else {
    // по символу -> на кнопках названия
    question = `Найди атом с символом <b>${correct.sym}</b>`;
    buttonMode = "name";
  }

  return { correct, options, question, buttonMode };
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ===== ОТРИСОВКА ===== */
function renderRound() {
  locked = false;
  document.getElementById("nextBtn").disabled = true;
  document.getElementById("msg").textContent = "";
  document.getElementById("msg").className = "msg";

  const t = makeTask();
  currentTask = t;

  document.getElementById("task").innerHTML = t.question;
  document.getElementById("roundVal").textContent = `${round} / ${TOTAL_ROUNDS}`;

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  t.options.forEach(el => {
    const card = document.createElement("div");
    card.className = "card";
    // ВАЖНО: если ищем по символу — на кнопках названия, иначе — символы
    const label = (t.buttonMode === "name") ? el.name : el.sym;
    card.innerHTML = `<div class="symbol">${label}</div>`;
    card.onclick = () => pick(card, el);
    grid.appendChild(card);
  });
}

function pick(card, el) {
  if (locked) return;

  if (el.sym === currentTask.correct.sym) {
    locked = true;
    card.classList.add("correct", "done");
    score += 10;
    document.getElementById("scoreVal").textContent = score;
    const msg = document.getElementById("msg");
    msg.textContent = "✅ Верно! Это " + el.name + " (" + el.sym + ", Z = " + el.z + ")";
    msg.className = "msg good";
    document.getElementById("nextBtn").disabled = false;
  } else {
    errors++;
    document.getElementById("errVal").textContent = errors;
    card.classList.add("wrong");
    setTimeout(() => card.classList.remove("wrong"), 450);
    const msg = document.getElementById("msg");
    msg.textContent = "❌ Не то. Попробуй ещё!";
    msg.className = "msg bad";
  }
}

/* ===== УПРАВЛЕНИЕ ===== */
document.getElementById("nextBtn").onclick = () => {
  round++;
  if (round > TOTAL_ROUNDS) {
    endGame();
  } else {
    renderRound();
  }
};

function endGame() {
  document.getElementById("playArea").classList.add("hidden");
  const f = document.getElementById("finalArea");
  f.classList.remove("hidden");

  document.getElementById("finalScore").textContent =
    `Правильных ответов: ${TOTAL_ROUNDS - errors} из ${TOTAL_ROUNDS}. Счёт: ${score}. Ошибок: ${errors}.`;

  let rank;
  if (errors === 0) rank = "🏆 Атомный гений! Идеальный результат!";
  else if (errors <= 2) rank = "🥇 Отличный уровень! Ты хорошо знаешь строение атома.";
  else if (errors <= 4) rank = "🥈 Хорошо! Ещё немного практики — и будет отлично.";
  else rank = "📚 Стоит повторить заряд ядра и символы элементов. Попробуй снова!";

  document.getElementById("finalRank").textContent = rank;
}

function restart() {
  round = 1;
  score = 0;
  errors = 0;
  document.getElementById("scoreVal").textContent = 0;
  document.getElementById("errVal").textContent = 0;
  document.getElementById("finalArea").classList.add("hidden");
  document.getElementById("playArea").classList.remove("hidden");
  renderRound();
}

/* ===== СТАРТ ===== */
round = 1;
score = 0;
errors = 0;
renderRound();
</script>
</body>
</html>
